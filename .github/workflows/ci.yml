name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check hallucinotype/

      - name: Test
        run: pytest tests/ -v -m "not slow" --tb=short

  install:
    name: Install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Install built wheel (not editable, not from source dir)
        run: pip install dist/*.whl

      - name: Verify import and console script from a clean directory
        working-directory: /tmp
        run: |
          python -c "import hallucinotype; print(hallucinotype.__version__)"
          hallucinotype --version
